<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" role="img"
             aria-label="Two lanes compared. The runtime lane, triggered by a visitor, runs question to router to answer with no model and no network. The ingestion lane, triggered by the creator offline, runs transcript to either an optional language model or a heuristic extractor, then to candidates, then to a human approval gate before anything enters the store.">

  <style>
    svg { --det: #1a6b58; --opt: #8a5424; color: #10131a; background: #ffffff;
          font-family: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --det: #57c7a6; --opt: #d8a163; color: #e6eaf0; background: #0f1217; }
    }
  </style>
          <defs>
            <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
            </marker>
          </defs>

          <text x="16" y="20" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="0.6" fill="var(--det)">RUNTIME — A VISITOR ASKS</text>
          <text x="512" y="20" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="0.6" fill="var(--opt)">INGESTION — THE CREATOR, OFFLINE</text>

          <rect x="16" y="32" width="452" height="324" rx="4" fill="none" stroke="var(--det)" stroke-width="1.4"/>
          <rect x="512" y="32" width="452" height="324" rx="4" fill="none" stroke="var(--opt)" stroke-width="1.4" stroke-dasharray="6 4"/>

          <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4">
            <rect x="44" y="60" width="396" height="44" rx="3"/>
            <rect x="44" y="136" width="396" height="44" rx="3"/>
            <rect x="44" y="212" width="396" height="44" rx="3"/>
            <rect x="540" y="60" width="396" height="44" rx="3"/>
            <rect x="540" y="212" width="396" height="44" rx="3"/>
            <rect x="540" y="288" width="396" height="44" rx="3"/>
          </g>

          <rect x="540" y="136" width="190" height="44" rx="3" fill="none" stroke="var(--opt)" stroke-width="1.6"/>
          <rect x="746" y="136" width="190" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>

          <g font-size="12.5" fill="currentColor">
            <text x="60" y="87">Question · chips · free text</text>
            <text x="60" y="163">Router, rules, templates</text>
            <text x="60" y="239">Answer, with the rule shown</text>
            <text x="556" y="87">Transcript pasted, or audio</text>
            <text x="556" y="163" fill="var(--opt)">LLM extractor</text>
            <text x="762" y="163">Heuristic extractor</text>
            <text x="556" y="239">candidates · her exact sentence kept</text>
            <text x="556" y="315">Human approves → judgement unit</text>
          </g>

          <g font-size="11" fill="currentColor" opacity="0.62">
            <text x="556" y="103" font-family="IBM Plex Mono, monospace">OPENAI_API_KEY optional</text>
            <text x="556" y="179" font-family="IBM Plex Mono, monospace" font-size="10.5">if ANTHROPIC_API_KEY</text>
            <text x="762" y="179" font-family="IBM Plex Mono, monospace" font-size="10.5">if not — the default</text>
          </g>

          <g stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#a3)">
            <line x1="242" y1="104" x2="242" y2="132"/>
            <line x1="242" y1="180" x2="242" y2="208"/>
            <path d="M 635 104 V 132"/>
            <path d="M 841 104 V 132"/>
            <path d="M 635 180 V 208"/>
            <path d="M 841 180 V 208"/>
            <line x1="738" y1="256" x2="738" y2="284"/>
          </g>

          <text x="252" y="123" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity="0.72">deterministic</text>
          <text x="252" y="199" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity="0.72">deterministic</text>
          <text x="748" y="277" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="var(--opt)">gate — never automatic</text>

          <text x="60" y="290" font-size="12" fill="var(--det)">0 external calls · works with the network unplugged</text>
          <text x="60" y="312" font-size="11.5" fill="currentColor" opacity="0.62">Voice is a cached mp3, then the browser's own speech, then text.</text>

          <text x="556" y="348" font-size="11.5" fill="currentColor" opacity="0.62">A proposed unit whose quote is not in the transcript is discarded.</text>
          <text x="60" y="348" font-size="11.5" fill="currentColor" opacity="0.62">Tested: same input, same answer id, same text.</text>
        </svg>
