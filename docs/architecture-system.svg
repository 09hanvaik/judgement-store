<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img"
             aria-label="System diagram: capture feeds a candidate queue and an approval UI; approved judgement units enter the store; the router reads a snapshot of the store and writes content-addressed answers; surfaces render those answers and log events, which aggregate into the creator panel.">

  <style>
    svg { --det: #1a6b58; --opt: #8a5424; color: #10131a; background: #ffffff;
          font-family: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --det: #57c7a6; --opt: #d8a163; color: #e6eaf0; background: #0f1217; }
    }
  </style>
          <defs>
            <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
            </marker>
          </defs>

          <g font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="0.6" fill="currentColor" opacity="0.55">
            <text x="16" y="24">CAPTURE</text>
            <text x="220" y="24">JUDGEMENT STORE</text>
            <text x="424" y="24">ROUTER</text>
            <text x="628" y="24">CACHE</text>
            <text x="810" y="24">SURFACES</text>
          </g>

          <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.32">
            <rect x="16" y="40" width="168" height="54" rx="3"/>
            <rect x="16" y="134" width="168" height="54" rx="3" stroke-dasharray="4 3"/>
            <rect x="16" y="228" width="168" height="54" rx="3"/>
          </g>

          <g font-size="12.5" fill="currentColor">
            <text x="30" y="62">Voice note · notebook</text>
            <text x="30" y="80">DM · post</text>
            <text x="30" y="156">candidates</text>
            <text x="30" y="174" font-size="11" opacity="0.6">never answerable</text>
            <text x="30" y="250">Approval UI</text>
            <text x="30" y="268" font-family="IBM Plex Mono, monospace" font-size="11" opacity="0.6">/creator/[slug]/review</text>
          </g>

          <g stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#a1)">
            <line x1="100" y1="94" x2="100" y2="130"/>
            <line x1="100" y1="188" x2="100" y2="224"/>
            <path d="M 184 255 H 204 V 200 H 216"/>
            <line x1="388" y1="150" x2="420" y2="150"/>
            <line x1="592" y1="120" x2="624" y2="120"/>
            <line x1="778" y1="120" x2="806" y2="120"/>
            <path d="M 887 286 V 340 H 508 V 356"/>
            <line x1="592" y1="405" x2="624" y2="405"/>
            <line x1="778" y1="405" x2="806" y2="405"/>
          </g>

          <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity="0.72">
            <text x="108" y="116">extract</text>
            <text x="108" y="210">review</text>
            <text x="190" y="192">approve</text>
            <text x="392" y="142">snapshot</text>
            <text x="596" y="112">persist</text>
            <text x="782" y="112">render</text>
            <text x="560" y="334">answer_viewed · save · share · return_visit</text>
            <text x="596" y="397">aggregate</text>
            <text x="782" y="397">read</text>
          </g>

          <rect x="216" y="40" width="172" height="242" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <g font-size="12.5" fill="currentColor">
            <text x="230" y="64">creators</text>
            <text x="230" y="88">items</text>
            <text x="230" y="112">judgement_units</text>
            <text x="230" y="136">rules</text>
            <text x="230" y="160">templates</text>
          </g>
          <g font-size="11" fill="currentColor" opacity="0.6">
            <text x="230" y="196">SQLite via libSQL</text>
            <text x="230" y="214">JSON columns as TEXT,</text>
            <text x="230" y="232">read through typed helpers</text>
            <text x="230" y="262">status: approved | candidate</text>
          </g>

          <rect x="420" y="40" width="172" height="242" rx="3" fill="none" stroke="var(--det)" stroke-width="1.8"/>
          <g font-size="12.5" fill="currentColor">
            <text x="434" y="64">normalise</text>
            <text x="434" y="86">classify · 9 modes</text>
            <text x="434" y="108">constraints</text>
            <text x="434" y="130">filter units</text>
            <text x="434" y="152">apply rules</text>
            <text x="434" y="174">rank</text>
            <text x="434" y="196">skip notes</text>
            <text x="434" y="218">render</text>
          </g>
          <text x="434" y="252" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--det)">pure function</text>
          <text x="434" y="268" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--det)">no model · no network</text>

          <rect x="624" y="40" width="154" height="242" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.32"/>
          <g font-size="12.5" fill="currentColor">
            <text x="638" y="64">answers</text>
          </g>
          <g font-size="11" fill="currentColor" opacity="0.6">
            <text x="638" y="90">immutable</text>
            <text x="638" y="108">id = hash of</text>
            <text x="638" y="126">creator + query</text>
            <text x="638" y="144">+ units + template</text>
            <text x="638" y="174">same question,</text>
            <text x="638" y="192">same id,</text>
            <text x="638" y="210">same audio</text>
          </g>

          <rect x="806" y="40" width="158" height="242" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.32"/>
          <g font-family="IBM Plex Mono, monospace" font-size="11.5" fill="currentColor">
            <text x="820" y="64">/c/[slug]</text>
            <text x="820" y="88">/a/[id]</text>
            <text x="820" y="112">/c/[slug]/saves</text>
          </g>
          <g font-size="11" fill="currentColor" opacity="0.6">
            <text x="820" y="140">ask · chips</text>
            <text x="820" y="158">share page + OG card</text>
            <text x="820" y="176">my picks</text>
            <text x="820" y="206">one answer card,</text>
            <text x="820" y="224">used everywhere</text>
          </g>

          <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.32">
            <rect x="424" y="356" width="168" height="76" rx="3"/>
            <rect x="624" y="356" width="154" height="76" rx="3"/>
            <rect x="806" y="356" width="158" height="76" rx="3"/>
          </g>
          <g font-size="12.5" fill="currentColor">
            <text x="438" y="380">events · shares</text>
            <text x="438" y="398">saves · visitors</text>
            <text x="638" y="380">insights</text>
            <text x="820" y="380">/creator/[slug]</text>
          </g>
          <g font-size="11" fill="currentColor" opacity="0.6">
            <text x="438" y="420">new signal = new type</text>
            <text x="638" y="398">funnel · chains</text>
            <text x="638" y="416">lag · time back</text>
            <text x="820" y="398">live vs sample,</text>
            <text x="820" y="416">kept apart</text>
          </g>
        </svg>
