<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img"
             aria-label="The nine-stage answer pipeline, from raw text through normalise, classify, extract constraints, filter units, apply rules, rank, skip notes, ask-back and render, ending in a ten-character content hash. The whole pipeline sits inside a sealed boundary marked no network, no model, no clock, no randomness.">

  <style>
    svg { --det: #1a6b58; --opt: #8a5424; color: #10131a; background: #ffffff;
          font-family: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --det: #57c7a6; --opt: #d8a163; color: #e6eaf0; background: #0f1217; }
    }
  </style>
          <defs>
            <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
            </marker>
          </defs>

          <text x="16" y="20" font-size="12.5" fill="currentColor">Raw text, chips, visitor context</text>
          <line x1="180" y1="30" x2="180" y2="52" stroke="currentColor" stroke-width="1.2" marker-end="url(#a2)"/>

          <rect x="14" y="56" width="692" height="516" rx="4" fill="none"
                stroke="var(--det)" stroke-width="1.5" stroke-dasharray="6 4"/>
          <text x="30" y="80" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--det)">
            NO NETWORK · NO MODEL · NO CLOCK · NO RANDOMNESS
          </text>

          <g>
            <rect x="30" y="96" width="300" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
            <rect x="30" y="148" width="300" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
            <rect x="30" y="200" width="300" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
            <rect x="30" y="252" width="300" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
            <rect x="30" y="304" width="300" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
            <rect x="30" y="356" width="300" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
            <rect x="30" y="408" width="300" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
            <rect x="30" y="460" width="300" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
            <rect x="30" y="512" width="300" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
          </g>

          <g stroke="currentColor" stroke-width="1.1" opacity="0.55" marker-end="url(#a2)">
            <line x1="180" y1="140" x2="180" y2="145"/>
            <line x1="180" y1="192" x2="180" y2="197"/>
            <line x1="180" y1="244" x2="180" y2="249"/>
            <line x1="180" y1="296" x2="180" y2="301"/>
            <line x1="180" y1="348" x2="180" y2="353"/>
            <line x1="180" y1="400" x2="180" y2="405"/>
            <line x1="180" y1="452" x2="180" y2="457"/>
            <line x1="180" y1="504" x2="180" y2="509"/>
          </g>

          <g font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity="0.5">
            <text x="46" y="123">1</text><text x="46" y="175">2</text><text x="46" y="227">3</text>
            <text x="46" y="279">4</text><text x="46" y="331">5</text><text x="46" y="383">6</text>
            <text x="46" y="435">7</text><text x="46" y="487">8</text><text x="46" y="539">9</text>
          </g>

          <g font-size="12.5" fill="currentColor">
            <text x="72" y="123">normalise</text>
            <text x="72" y="175">classify mode</text>
            <text x="72" y="227">extract constraints</text>
            <text x="72" y="279">filter judgement units</text>
            <text x="72" y="331">apply rules</text>
            <text x="72" y="383">rank</text>
            <text x="72" y="435">skip notes</text>
            <text x="72" y="487">ask back</text>
            <text x="72" y="539">render</text>
          </g>

          <g font-size="11.5" fill="currentColor" opacity="0.62">
            <text x="352" y="118">slang, typos, £ amounts,</text>
            <text x="352" y="134">"5 mins" → time_minutes</text>
            <text x="352" y="170">chip, then weighted phrases,</text>
            <text x="352" y="186">then fall back — 9 modes + none</text>
            <text x="352" y="222">skin type, budget, occasion,</text>
            <text x="352" y="238">owned items; chips win</text>
            <text x="352" y="274">approved only, matched by</text>
            <text x="352" y="290">typed predicates, not text</text>
            <text x="352" y="326">exclusions first, then includes</text>
            <text x="352" y="342">and boosts; fired ids kept</text>
            <text x="352" y="378">budget → score → priority</text>
            <text x="352" y="394">→ id; cap 1 or 2</text>
            <text x="352" y="430">what she would skip,</text>
            <text x="352" y="446">attributed to her rule</text>
            <text x="352" y="482">one question, never two,</text>
            <text x="352" y="498">when a fact is missing</text>
            <text x="352" y="534">template + slots + capped</text>
            <text x="352" y="550">filler, seeded by the hash</text>
          </g>

          <line x1="180" y1="572" x2="180" y2="594" stroke="currentColor" stroke-width="1.2" marker-end="url(#a2)"/>
          <text x="16" y="620" font-size="12.5" fill="currentColor">
            Answer · pick, score, note, the rule that fired, disclosure
          </text>
          <text x="470" y="620" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="var(--det)">id = sha256(…).slice(0,10)</text>
        </svg>
